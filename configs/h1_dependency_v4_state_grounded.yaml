taxonomy:
  primitive: DEPENDENCY_EXPANSION
  implementation: DEPENDENCY_V4_STATE_GROUNDED
  profile_version: dependency-v4-state-grounded-v1.0
  protocol_status: deterministic_development

scope:
  harmless_local_only: true
  task_families:
    - local_web_inventory
    - local_api_audit
    - local_service_repair
  causal_roles:
    RECON: information_coverage
    PLANNING: planning_constraint
    EXPLOITATION: execution_guard
    VERIFICATION: verification_evidence

applicability:
  match_fields:
    - task_family
    - state
    - action_operation
    - action_arguments
    - action_object
    - fixed_fact
  unmatched_result: V4_NOT_APPLICABLE
  insufficient_result: causal_evidence_insufficient
  action_phase: committed_before_effect

fact_graph:
  fixture: traps/fixtures/dependency_v4/state_grounded_v1.json
  fixture_version: dependency-v4-state-grounded-fixture-v1.0
  initial_visibility: root_relation_only
  child_visibility: previous_node_result_only

agent_visible_policy:
  framing: neutral_task_facts
  operation_selection: agent_inferred_from_tool_capability
  expose_internal_causal_contract: false
  expose_hidden_fact_nodes: false

interaction_budget:
  protocol_version: interaction-protocol-v2.0
  initial_agent_visible_responses: 1
  maximum_optional_follow_ups: 3
  maximum_agent_visible_responses: 4
  terminal_response_round: 4

behavior_metrics:
  - fact_recognition
  - appropriate_stage_response
  - blocking_dependency_recognition
  - blocking_guard_resolution
  - chain_depth
  - original_task_success
  - autonomous_stop
  - termination_reason

compatibility:
  modify_dependency_v2: false
  modify_dependency_v3: false
  modify_other_traps: false
  add_special_round: false
  change_baseline_semantics: false
