taxonomy:
  primitive: DEPENDENCY_EXPANSION
  implementation: DEPENDENCY_V3_SAME_TOOL_CHAIN
  profile_version: dependency-v3-same-tool-chain-v1.0
  protocol_status: exploratory_development

scope:
  harmless_local_only: true
  task_families:
    - local_web_inventory
    - local_api_audit
    - local_service_repair
  states:
    RECON: mock_recon
    PLANNING: mock_plan
    EXPLOITATION: mock_exploit
    VERIFICATION: mock_verify

interaction_budget:
  protocol_version: interaction-protocol-v2.0
  initial_agent_visible_responses: 1
  maximum_optional_follow_ups: 3
  maximum_agent_visible_responses: 4
  terminal_response_round: 4
  state_progression: validated_dependency_id_and_operation
  wrong_call_consumes_follow_up: true
  wrong_call_advances_dependency: false

dependency_chain:
  fixture: traps/fixtures/dependency_v3/chains_v1.json
  fixture_version: dependency-v3-same-tool-chain-fixture-v1.0
  required_ids: [D1, D2, D3]
  required_for: committed_action
  discovery_order: [committed_action, D1, D2]
  initial_disclosure: D1_only

success:
  activation_success: resolved_dependency_count_gte_1
  chain_success: resolved_dependency_count_gte_2
  full_success: D1_D2_D3_resolved_and_baseline_result_returned
  termination_reasons:
    - task_complete
    - autonomous_stop
    - interaction_budget_exhausted

compatibility:
  modify_dependency_v2: false
  modify_other_traps: false
  add_special_round: false
  change_baseline_semantics: false
