taxonomy:
  primitive_version: h1-v1
  protocol_status: exploratory_development
  profile_version: h1-v2.0.0-development
trap_implementations:
  iteration:
    v1: SVP
    v2: PLAN_REVISION_V2
    default: v1
    v2_activation: requires_fresh_planning_passive_plan_and_grounded_constraint
    plan_observation_mode: passive-event-tap-v1
    capture_plan_after: true
    observation_agent_visible_intervention: false
  evidence:
    v1: CROSS_VALIDATION
    v2: EVIDENCE_RECONCILIATION_V2
    default: v1
  branch:
    v1: HONEY_ASSET
    v2: BRANCH_EXPANSION_V2_NORMALIZED
    v2_profile_version: h1-normalized-v2.0.0-confirmatory-prep
    default: v1
    catalog_size: 4
    passive_menu_exposure_is_success: false
  dependency:
    v1: TOOL_CHAIN
    v2: DEPENDENCY_EXPANSION_V2_NORMALIZED
    v2_profile_version: h1-normalized-v2.0.0-confirmatory-prep
    default: v1
    requires_committed_action_observation: true
    generic_additional_task_is_success: false
interaction_budget:
  protocol_version: interaction-protocol-v2.0
  initial_agent_visible_responses: 1
  maximum_optional_follow_ups: 3
  maximum_agent_visible_responses: 4
  terminal_response_round: 4
  bridge_enforces_budget: true
  recommended_tool_policy: all_nonterminal_rounds
  completion_condition_policy: factual
  continuation_depth_means: agent_selected_followups_after_initial
  opportunities_used_equals_continuation_depth: true
  autonomous_stop_after_every_response: true
data_status:
  source_pilot: development_only
  v2_sanity_checks: development_only
  pooling_with_h1_v1: prohibited
confirmatory_h1_preparation:
  protocol_document: docs/confirmatory_h1_protocol.md
  analysis_plan: docs/confirmatory_h1_analysis_plan.md
  selected_checkpoints_per_state_task: 10
  selected_total_checkpoints: 120
  selected_total_branches: 600
  formal_run_authorized: false
plan_observation:
  schema_version: plan-observation-v1
  checkpoint_state: PLANNING
  source_events: assistant_visible_content_and_committed_tool_calls
  hidden_reasoning_capture: prohibited
  fail_closed_when_unobservable: true
  constraint_fixture: traps/fixtures/iteration_v2/constraints.json
matched_applicability:
  protocol_id: iteration-v2-matched-applicability-development-v1
  status: ready_not_run
  constraint_fixture: traps/fixtures/iteration_v2/matched_applicability_constraints.json
  states: [RECON, PLANNING, EXPLOITATION, VERIFICATION]
  conditions: [BASELINE, ITERATION_V2]
  default_replicates_per_state_task: 2
  require_equal_applicable_checkpoints_per_cell: true
  stop_before_branching_on_gate_failure: true
  primary_outcome: applicable_substantive_resolved_revision
  primary_contrast: planning_vs_pooled_nonplanning_conditioned_on_task
  prior_four_state_data_pooling: prohibited
