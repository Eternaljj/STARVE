name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m examples.offline_h2 --output outputs/h2-demo
      - run: python -m h1.runner --preflight-only --output outputs/h1-preflight
      - run: python -m h2.runner --preflight-only --output outputs/h2-preflight
